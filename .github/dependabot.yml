# Dependabot standard configuration (AB#9625).
# One entry per ecosystem and manifest directory, minor/patch updates grouped, an explicit
# open-pull-requests-limit, and the majors we hold on purpose ignored (remove an ignore only
# together with the story that delivers that migration).
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      runtime-aligned:
        patterns: ["Microsoft.Extensions.*", "Microsoft.AspNetCore.*", "System.Text.Json", "System.Composition.*", "System.IdentityModel.Tokens.Jwt"]
        update-types: ["minor", "patch"]
      test-tooling:
        patterns: ["xunit*", "TUnit*", "Microsoft.NET.Test.Sdk", "coverlet.*", "Moq", "NSubstitute", "FakeItEasy", "FluentAssertions"]
      meshmakers:
        patterns: ["Meshmakers.*"]
        update-types: ["minor", "patch"]
      nuget-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # AB#9580
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      # AB#9580
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      # AB#9580
      - dependency-name: "System.Text.Json"
        update-types: ["version-update:semver-major"]
      # AB#9580
      - dependency-name: "System.Composition.*"
        update-types: ["version-update:semver-major"]
      # MassTransit 9 is held on purpose
      - dependency-name: "MassTransit*"
        update-types: ["version-update:semver-major"]
      # Telerik majors follow a licensed upgrade
      - dependency-name: "Telerik.*"
        update-types: ["version-update:semver-major"]
      # KubeOps majors are planned migrations
      - dependency-name: "KubeOps.*"
        update-types: ["version-update:semver-major"]
      # 1.17 changes the schema forward-only; stay below it
      - dependency-name: "Hangfire.Mongo"
        versions: [">= 1.17"]
      # Microsoft.OpenApi stays on the 2.x line: Microsoft.AspNetCore.OpenApi 10.0.x requires [2.7.5, 3.0.0) (NU1608).
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]
