"$schema": "https://schemas.meshmakers.cloud/construction-kit-elements.schema.json"
types:
  - typeId: NotificationPreference
    description: One user subscribed to a notification subscription, with when they get its new rows.
    derivedFromCkTypeId: ${System}/Entity
    isFinal: true
    isAbstract: false
    attributes:
      - id: ${this}/SubjectId
        name: SubjectId
      - id: ${this}/CronExpression
        name: CronExpression
      - id: ${this}/SkipExistingRows
        name: SkipExistingRows
      - id: ${this}/TimeZone
        name: TimeZone
        isOptional: true
    associations:
      - id: ${this}/PreferenceSubscription
        targetCkTypeId: ${this}/NotificationSubscription
