"$schema": "https://schemas.meshmakers.cloud/construction-kit-elements.schema.json"
types:
  - typeId: NotificationSubscription
    description: What to notify about (a runtime query) and what to send (a notification template); users subscribe to it with a notification preference.
    derivedFromCkTypeId: ${System}/Entity
    isFinal: true
    isAbstract: false
    attributes:
      - id: ${System}/Name
        name: Name
      - id: ${System}/Description
        name: Description
        isOptional: true
      - id: ${System}/Enabled
        name: Enabled
        ownership: TenantOwned
      - id: ${this}/DeployedAt
        name: DeployedAt
        isOptional: true
    associations:
      - id: ${this}/SubscriptionQuery
        targetCkTypeId: ${System}/PersistentQuery
      - id: ${this}/SubscriptionTemplate
        targetCkTypeId: ${this}/NotificationTemplate
