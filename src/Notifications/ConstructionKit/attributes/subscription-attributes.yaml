"$schema": "https://schemas.meshmakers.cloud/construction-kit-elements.schema.json"
attributes:
  - id: CronExpression
    description: Cron expression with five fields, or six with seconds, that sets when the preference's user gets the new rows of the subscription
    valueType: String
    ownership: TenantOwned
  - id: SkipExistingRows
    description: Rows that already match the query when the preference starts (created or its subscription deployed, whichever is later) are not sent to its user
    valueType: Boolean
    defaultValues:
      - true
    ownership: TenantOwned
  - id: SubjectId
    description: Subject id (token sub) of the Identity user the preference belongs to
    valueType: String
    ownership: TenantOwned
  - id: DeployedAt
    description: When the subscription was last deployed; a preference starts at the later of its creation and this moment
    valueType: DateTime
    ownership: TenantOwned
  - id: TimeZone
    description: IANA time zone (for example Europe/Vienna) the preference's cron expression is scheduled in, and that dates in its mails are shown in; empty means UTC
    valueType: String
    ownership: TenantOwned
  - id: ProcessedUntil
    description: The change time (rtChangedDateTime) up to which the query result was processed; the next run reads only rows changed after it, minus a five-minute overlap for late commits and clock skew; empty means from the beginning
    valueType: DateTime
    ownership: TenantOwned
  - id: SentRows
    description: The rows mailed to the user, so that they are not mailed again; an entry is kept while the next run could read its row again (changed inside the overlap) and otherwise for 30 days, at most the 10,000 most recent, so the size is bounded by the recent sends and not by the size of the query result
    valueType: RecordArray
    valueCkRecordId: ${this}/SentRow
    ownership: TenantOwned
  - id: SentRowRtId
    description: The rtId of a row of the query result that was mailed
    valueType: String
    ownership: TenantOwned
  - id: SentRowAt
    description: When the row was mailed; the entry is dropped 30 days later
    valueType: DateTime
    ownership: TenantOwned
  - id: SentRowChangedAt
    description: The change time of the row when it was mailed; while it lies inside the overlap the next run reads, the entry is never dropped
    valueType: DateTime
    ownership: TenantOwned
  - id: QueryRtId
    description: The query the delivery state was built with; when the subscription points at another query, the next run is a new start
    valueType: String
    ownership: TenantOwned
  - id: DeliveredToSubjectId
    description: The subject id the delivery state was built for; when the preference names another user, the next run starts from scratch
    valueType: String
    ownership: TenantOwned
  - id: DeliveredWithSkipExistingRows
    description: The start option the delivery state was built with; when the preference switches between Onwards and Catch up, the next run is a new start that keeps the rows sent in the last 30 days
    valueType: Boolean
    ownership: TenantOwned
  - id: LastRunAt
    description: When the engine last ran the preference's query
    valueType: DateTime
    ownership: TenantOwned
  - id: LastSentAt
    description: When the engine last sent the preference's user a mail
    valueType: DateTime
    ownership: TenantOwned
  - id: LastError
    description: Why the last run of the preference failed; empty after a successful run
    valueType: String
    ownership: RuntimeState
  - id: RunningSince
    description: Lease of a run in progress; another tick of the same preference is skipped while it is recent
    valueType: DateTime
    ownership: RuntimeState
